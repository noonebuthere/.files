$mauve = rgba(7c4a6bff)
$bg = rgba(282828ee)
$fg = rgba(ebdbb2ff)

general {
    disable_loading_bar = false
    grace = 0
    hide_cursor = false
    no_fade_in = false
}

background {
    monitor =
    path = /home/fabian/backgrounds/pink-mountains.jpg
    blur_passes = 3
    blur_size = 8
    noise = 0.02
    contrast = 0.9
    brightness = 0.6
    vibrancy = 0.2
}

# Clock
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    font_size = 90
    font_family = sans
    color = $fg
    position = 0, 200
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %d %B")"
    font_size = 20
    font_family = sans
    color = $fg
    position = 0, 120
    halign = center
    valign = center
}

# Password field
input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    outer_color = $mauve
    inner_color = $bg
    font_color = $fg
    fade_on_empty = false
    placeholder_text = <span foreground="##ebdbb2">Password...</span>
    hide_input = false
    position = 0, -100
    halign = center
    valign = center
}
